name: Kontroly projektu

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-qr.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vývojové závislosti
        run: python -m pip install -r requirements-dev.txt -r requirements-qr.txt
      - name: Testovací prohlížeč
        run: python -m playwright install --with-deps chromium
      - name: XML, JSON a HTML vstupy
        run: python validate_project.py
      - name: Syntax JavaScriptu
        run: find web/js -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Chování webu a PDF
        run: python tests/browser_smoke.py
        env:
          PULSE_TEST_ARTIFACTS: test-artifacts/browser
      - name: Prezentace a prototyp
        run: python tests/course_materials.py --folder odevzdani
      - name: Výsledky prohlížeče
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: test-artifacts/
          if-no-files-found: ignore
